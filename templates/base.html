<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Online Do'kon{% endblock %}</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="{% url 'home' %}">Kitob Do'koni</a>
            <div class="navbar-nav ms-auto">
    {% if user.is_staff %}
        <!-- Dashboard tugmasini yorqin sariq tugma (button) ko'rinishiga keltiramiz -->
        <a class="btn btn-warning btn-sm me-3 fw-bold" href="{% url 'dashboard' %}">📊 Dashboard</a>
    {% endif %}

    {% if user.is_authenticated %}
        <span class="nav-link text-light me-2">👤 {{ user.username }}</span>
        <form action="{% url 'logout' %}" method="post" style="display:inline;">
            {% csrf_token %}
            <button type="submit" class="btn btn-outline-danger btn-sm">Chiqish</button>
        </form>
    {% else %}
        <a class="btn btn-outline-light btn-sm me-2" href="{% url 'login' %}">Kirish</a>
        <a class="btn btn-light btn-sm" href="{% url 'signup' %}">Ro'yxatdan o'tish</a>
    {% endif %}
</div>
        </div>
    </nav>


    <div class="container mt-4">
        {% block content %}
        {% endblock %}
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
