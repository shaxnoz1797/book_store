{% extends 'base.html' %}

{% block content %}
<div class="container mt-5">
    <div class="row">
        <!-- Kitob rasmi -->
        <div class="col-md-5">
            <div class="card shadow">
                <img src="{{ book.image.url }}" class="img-fluid rounded" alt="{{ book.name }}">
            </div>
        </div>

        <!-- Kitob ma'lumotlari -->
        <div class="col-md-7">
            <nav aria-label="breadcrumb">
                <ol class="breadcrumb">
                  <li class="breadcrumb-item"><a href="{% url 'home' %}">Bosh sahifa</a></li>
                  <li class="breadcrumb-item active">{{ book.category.name }}</li>
                </ol>
            </nav>

            <h1 class="display-5 fw-bold">{{ book.name }}</h1>
            <hr>
            <h3 class="text-primary mb-3">{{ book.price }} so'm</h3>

            <h5>Kitob haqida ma'lumot:</h5>
            <p class="lead text-muted">
                {{ book.description }}
            </p>

            <div class="mt-5 d-grid gap-2 d-md-block">
                <!-- 1. Savatchaga qo'shish tugmasi -->
                <a href="{% url 'add_to_cart' book.id %}" class="btn btn-outline-primary btn-lg px-4 me-md-2">
                    <i class="bi bi-cart-plus"></i> Savatga qo'shish
                </a>

                <!-- 2. To'g'ridan-to'g'ri sotib olish -->
                <a href="{% url 'create_order' book.id %}" class="btn btn-success btn-lg px-4">
                    Hoziroq sotib olish
                </a>
            </div>

            <div class="mt-4">
                <small class="text-muted">Kategoriya: {{ book.category.name }}</small>
            </div>
        </div>
    </div>
</div>
{% endblock %}
